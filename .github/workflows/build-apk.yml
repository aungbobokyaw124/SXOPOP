name: Build SXOPOP Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Capacitor Android
        run: |
          rm -rf android
          npx cap init SXOPOP com.sxopop.app --web-dir public
          npx cap add android
          npx cap copy android

      - name: Generate Keystore & Build Release APK
        run: |
          cd android
          keytool -genkeypair -v -keystore release.keystore -alias sxopop -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SXOPOP, OU=Dev, O=SXOPOP, L=Yangon, C=MM"
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Sign Release APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/SXOPOP-Release.apk
          $BUILD_TOOLS/apksigner sign --ks android/release.keystore --ks-pass pass:123456 --ks-key-alias sxopop --key-pass pass:123456 android/app/build/outputs/apk/release/SXOPOP-Release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SXOPOP-Release-APK
          path: android/app/build/outputs/apk/release/SXOPOP-Release.apk
