name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Copy Web Assets to Android
        run: npx cap sync android

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SXOPOP, OU=Dev, O=SXOPOP, L=Yangon, S=Yangon, C=MM"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          mkdir signed-apk
          zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk signed-apk/app-release-aligned.apk
          apksigner sign --ks release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out signed-apk/app-release-signed.apk \
            signed-apk/app-release-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SXOPOP-Release-APK
          path: signed-apk/app-release-signed.apk
